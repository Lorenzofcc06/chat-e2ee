name: Pipeline DevSecOps - Aula Pratica

# A esteira roda sempre que um Pull Request for aberto para a branch main
on:
  pull_request:
    branches: [ "main" ]

jobs:
  auditoria_seguranca:
    runs-on: ubuntu-latest

    steps:
    # 1. Faz o clone do código do repositório para o servidor do GitHub
    - name: Checkout do Código
      uses: actions/checkout@v3
      
    # 2. Prepara o ambiente Python
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    # 3. Instala as ferramentas de segurança (Bandit para SAST e pip-audit para SCA)
    - name: Instalar Ferramentas de Segurança
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit
        
    # 4. Executa a análise estática (SAST)
    - name: SAST - Auditoria de Código (Bandit)
      run: |
        echo "Buscando senhas expostas e injeções de SQL..."
        bandit -r . -f custom
        
    # 5. Executa a análise de dependências (SCA)
    # Obs: Só rodará se o passo anterior passar
    - name: SCA - Auditoria de Dependências (pip-audit)
      run: |
        echo "Verificando CVEs no requirements.txt..."
        pip-audit -r backend/requirements.txt
